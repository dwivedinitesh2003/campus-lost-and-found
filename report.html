<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Report Item | Campus Lost & Found</title><link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="navbar"><a class="brand" href="index.html">🔎 Campus Lost & Found</a><nav><a href="index.html">Home</a><a class="active" href="report.html">Report Item</a><a href="items.html">Browse Items</a><a href="dashboard.html">Dashboard</a><a href="admin-login.html">Admin</a></nav></header>
<main class="container">
  <div class="page-head"><div><span class="eyebrow">New Report</span><h1>Report a lost or found item</h1><p>Fill in accurate information so the right person can identify the item.<br><b style="color: red">(submitted that item to the lost and found department)</b></p></div></div>
  <form id="reportForm" class="form-card">
    <div class="form-grid">
      <label>Report Type<select name="type" required><option value="Lost">Lost</option><option value="Found">Found</option></select></label>
      <label>Item Name<input name="name" required placeholder="e.g. Black Wallet"></label>
      <label>Category<select name="category" required><option>Electronics</option><option>Documents</option><option>Accessories</option><option>Books</option><option>Clothing</option><option>Keys</option><option>Other</option></select></label>
      <label>Location<input name="location" required placeholder="e.g. Library"></label>
      <label>Date<input type="date" name="date" required></label>
      <label>Reporter Name<input name="reporter" required placeholder="Your name"></label>
      <label>Contact Email<input type="email" name="email" required placeholder="student@example.com"></label>
      <label>Unique Identification<input name="identifier" placeholder="Colour, brand, serial number, marks..."></label>
      <label class="full">Description<textarea name="description" rows="5" required placeholder="Describe the item and circumstances..."></textarea></label>
    </div>
    <div id="reportMessage"></div>
    <button class="btn primary" type="submit">Submit Report</button>
  </form>
</main>
<footer>Campus Lost & Found • MCA 3rd Semester (2026) Minor Project</footer>
<!--<script src="assets/app.js"></script>
<script>setupReportForm();</script>-->
<script src="assets/app.js"></script>

<script type="module">
import { auth, db } from "./firebase.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

import {
    collection,
    doc,
    setDoc
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const reportForm = document.getElementById("reportForm");
const reportMessage = document.getElementById("reportMessage");

onAuthStateChanged(auth, (user) => {

    if (!user) {
        window.location.href = "login.html";
        return;
    }

    reportForm.style.display = "block";

    reportForm.querySelector('[name="email"]').value = user.email || "";

    reportForm.date.value = new Date().toISOString().slice(0, 10);

    reportForm.addEventListener("submit", async (e) => {
        e.preventDefault();

        const data = Object.fromEntries(
            new FormData(reportForm).entries()
        );

        const reportRef = doc(collection(db, "reports"));

        const publicReport = {
            type: data.type,
            name: data.name,
            category: data.category,
            location: data.location,
            date: data.date,
            description: data.description,
            identifier: data.identifier,
            reporterUid: user.uid,
            status: "Open",
            createdAt: new Date().toISOString()
        };

        const privateReport = {
            reporter: data.reporter,
            email: user.email,
            reporterUid: user.uid
        };

        try {
            await setDoc(reportRef, publicReport);

            await setDoc(
                doc(db, "reportPrivate", reportRef.id),
                privateReport
            );

            reportMessage.textContent =
                "Report submitted successfully!";

            reportForm.reset();
            reportForm.querySelector('[name="email"]').value = user.email || "";

        } catch (error) {
            console.error(error);
            reportMessage.textContent =
                "Error submitting report: " + error.message;
        }
    });
});
</script>
</body>
</html>
