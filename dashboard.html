<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Campus Lost & Found</title>
    <link rel="stylesheet" href="assets/style.css">
    <style>
        #logoutBtn {
            background: #e53935;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-left: 15px;
        }

        #logoutBtn:hover {
            background: #c62828;
        }
    </style>
</head>

<body>
    <header class="navbar"><a class="brand" href="index.html">🔎 Campus Lost & Found</a>
        <nav><a href="index.html">Home</a><a href="report.html">Report Item</a><a href="items.html">Browse Items</a><a
                class="active" href="dashboard.html">Dashboard</a><a href="admin-login.html">Admin</a></nav>
    </header>
    <main class="container">
        <div class="page-head">
            <div><span class="eyebrow">User Dashboard</span>
                <h1>My reports & claims</h1>
                <p>View your reports and track your claim requests.</p>
            </div>
        </div>
        <div class="stats" id="dashboardStats"></div>
        <section class="section">
            <h2>My Reports</h2>
            <div id="myReports"></div>
        </section>
        <section class="section">
            <h2>My Claims</h2>
            <div id="myClaims"></div>
        </section>
    </main>
    <footer>Campus Lost & Found • MCA 3rd Semester (2026) Minor Project</footer>
    <!--<script src="assets/app.js"></script><script>renderDashboard();</script>*/-->
    <div style="text-align: center;">
        <button id="logoutBtn">Logout</button>
    </div>
    <script type="module">
import { auth, db } from "./firebase.js";

import {
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

import {
    collection,
    query,
    where,
    getDocs
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const logoutBtn = document.getElementById("logoutBtn");

const dashboardStats = document.getElementById("dashboardStats");
const myReports = document.getElementById("myReports");
const myClaims = document.getElementById("myClaims");

function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
    })[char]);
}

async function loadStudentDashboard(user) {

    dashboardStats.innerHTML = "<p>Loading dashboard...</p>";

    try {

        // Get student's own reports
        const reportsQuery = query(
            collection(db, "reports"),
            where("reporterUid", "==", user.uid)
        );

        // Get student's own claims
        const claimsQuery = query(
            collection(db, "claims"),
            where("claimantUid", "==", user.uid)
        );

        const [reportsSnapshot, claimsSnapshot] = await Promise.all([
            getDocs(reportsQuery),
            getDocs(claimsQuery)
        ]);

        const reports = reportsSnapshot.docs.map(d => ({
            id: d.id,
            ...d.data()
        }));

        const claims = claimsSnapshot.docs.map(d => ({
            id: d.id,
            ...d.data()
        }));

        const openReports = reports.filter(x => x.status === "Open").length;
        const resolvedReports = reports.filter(x => x.status === "Resolved").length;

        dashboardStats.innerHTML = [
            ["My Reports", reports.length],
            ["My Claims", claims.length],
            ["Open", openReports],
            ["Resolved", resolvedReports]
        ].map(x => `
            <div class="stat">
                <strong>${x[1]}</strong>
                <span>${x[0]}</span>
            </div>
        `).join("");

        // Display reports
        myReports.innerHTML = reports.length
            ? reports.map(item => `
                <div class="card" style="margin-bottom:10px">
                    <b>${escapeHTML(item.name)}</b>
                    — ${escapeHTML(item.type)}
                    <span class="pill">${escapeHTML(item.status)}</span>
                    <div class="item-meta">
                        ${escapeHTML(item.location)}
                        • ${escapeHTML(item.date)}
                    </div>
                </div>
            `).join("")
            : '<div class="empty">You have not submitted any reports yet.</div>';

        // Display claims
        myClaims.innerHTML = claims.length
            ? claims.map(claim => `
                <div class="card" style="margin-bottom:10px">
                    <b>${escapeHTML(claim.itemName)}</b>
                    <span class="pill">${escapeHTML(claim.status)}</span>
                    <p>${escapeHTML(claim.reason)}</p>
                </div>
            `).join("")
            : '<div class="empty">You have not submitted any claims yet.</div>';

    } catch (error) {
        console.error(error);
        dashboardStats.innerHTML =
            "<p>Error loading dashboard: " + escapeHTML(error.message) + "</p>";
    }
}

// Check student login
onAuthStateChanged(auth, user => {

    if (user) {
        loadStudentDashboard(user);
    } else {
        window.location.href = "login.html";
    }

});

// Logout
logoutBtn.addEventListener("click", async () => {

    try {
        await signOut(auth);
        window.location.href = "login.html";

    } catch (error) {
        alert(error.message);
    }

});
</script>
</body>

</html>
