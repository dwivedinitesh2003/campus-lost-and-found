<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 30px;
            width: 320px;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h2 {
            text-align: center;
            color: #1e3a8a;
        }

        input, button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            box-sizing: border-box;
        }

        input {
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        input:focus {
            outline: none;
            border-color: #3155c8;
            box-shadow: 0 0 0 3px rgba(49,85,200,0.10);
        }

        button {
            background: #3155c8;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #1e40af;
        }

        .password-field {
            position: relative;
        }

        .password-field input {
            padding-right: 45px;
        }

        .toggle-password {
            position: absolute;
            right: 5px;
            top: 15px;
            width: 38px;
            height: 40px;
            padding: 0;
            margin: 0;
            background: transparent;
            color: #475569;
            font-size: 18px;
        }

        .toggle-password:hover {
            background: transparent;
        }

        .forgot {
            display: block;
            text-align: right;
            margin-top: 10px;
            font-size: 14px;
        }

        p {
            text-align: center;
        }

        a {
            color: #3155c8;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        #message {
            font-size: 14px;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Student Login</h2>

    <form id="loginForm">

        <input type="email" id="email"
        placeholder="Email" required>

        <div class="password-field">
            <input type="password" id="password"
            placeholder="Password" required>

            <button type="button" class="toggle-password"
            id="togglePassword" aria-label="Show password">
                👁
            </button>
        </div>

        <a href="#" class="forgot" id="forgotPassword">
            Forgot Password?
        </a>

        <button type="submit">Login</button>

    </form>

    <p id="message"></p>

    <p>New Student?
        <a href="register.html">Register Here</a>
    </p>

</div>

<script type="module">

import { auth } from "./firebase.js";

import {
    signInWithEmailAndPassword,
    sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

const form = document.getElementById("loginForm");
const message = document.getElementById("message");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");

// Show / Hide Password

const togglePassword = document.getElementById("togglePassword");

togglePassword.addEventListener("click", () => {

    if (passwordInput.type === "password") {
        passwordInput.type = "text";
        togglePassword.textContent = "🙈";
        togglePassword.setAttribute("aria-label", "Hide password");
    } else {
        passwordInput.type = "password";
        togglePassword.textContent = "👁";
        togglePassword.setAttribute("aria-label", "Show password");
    }

});

// Login

form.addEventListener("submit", async (e) => {

    e.preventDefault();

    const email = emailInput.value.trim();
    const password = passwordInput.value;

    message.textContent = "Please wait...";

    try {

        await signInWithEmailAndPassword(auth, email, password);

        message.textContent = "Login Successful!";

        window.location.href = "index.html";

    } catch (error) {

        message.textContent = "Login failed: " + error.message;

    }

});

// Forgot Password

document.getElementById("forgotPassword")
.addEventListener("click", async (e) => {

    e.preventDefault();

    const email = emailInput.value.trim();

    if (!email) {
        message.textContent = "Please enter your registered email first.";
        emailInput.focus();
        return;
    }

    message.textContent = "Sending password reset link...";

    try {

        await sendPasswordResetEmail(auth, email);

        message.textContent =
            "Password reset link sent! Please check your email inbox.";

    } catch (error) {

        console.error(error);

        message.textContent =
            "Unable to send reset link. Please check your email and try again.";

    }

});

</script>

</body>
</html>
