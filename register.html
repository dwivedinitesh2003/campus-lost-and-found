<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 30px;
            width: 320px;
            border-radius: 14px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        h2 {
            text-align: center;
            color: #1e3a8a;
        }

        input, button {
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            box-sizing: border-box;
        }

        input {
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        input:focus {
            outline: none;
            border-color: #3155c8;
            box-shadow: 0 0 0 3px rgba(49, 85, 200, 0.10);
        }

        button {
            background: #3155c8;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s ease;
        }

        button:hover {
            background: #1e40af;
        }

        /* Password Show/Hide */

        .password-field {
            position: relative;
        }

        .password-field input {
            padding-right: 45px;
        }

        .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-30%);
            width: auto;
            margin: 0;
            padding: 5px;
            background: transparent;
            color: #1e3a8a;
            border: none;
            font-size: 19px;
            cursor: pointer;
        }

        .password-field .toggle-password:hover {
            background: transparent;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Student Registration</h2>

    <form id="registerForm">

        <input type="text" id="name"
        placeholder="Student Name" required>

        <input type="email" id="email"
        placeholder="Email" required>

        <div class="password-field">
            <input type="password" id="password"
            placeholder="Password (minimum 6 characters)" required>

            <button type="button" class="toggle-password"
            data-target="password">👁</button>
        </div>

        <div class="password-field">
            <input type="password" id="confirmPassword"
            placeholder="Confirm Password" required>

            <button type="button" class="toggle-password"
            data-target="confirmPassword">👁</button>
        </div>

        <button type="submit">Register</button>

    </form>

    <p id="message"></p>
</div>

<script type="module">
import { auth } from "./firebase.js";

import {
    createUserWithEmailAndPassword,
    updateProfile
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

const form = document.getElementById("registerForm");
const message = document.getElementById("message");

// Show/Hide Password for both fields
document.querySelectorAll(".toggle-password").forEach(button => {

    button.addEventListener("click", () => {

        const targetId = button.dataset.target;
        const passwordInput = document.getElementById(targetId);

        if (passwordInput.type === "password") {
            passwordInput.type = "text";
            button.textContent = "🙈";
        } else {
            passwordInput.type = "password";
            button.textContent = "👁";
        }

    });

});

form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (password !== confirmPassword) {
        message.style.color = "red";
        message.textContent = "Passwords do not match!";
        return;
    }

    if (password.length < 6) {
        message.style.color = "red";
        message.textContent = "Password must be at least 6 characters!";
        return;
    }

    try {
        const result = await createUserWithEmailAndPassword(
            auth, email, password
        );

        await updateProfile(result.user, {
            displayName: name
        });

        message.style.color = "green";
        message.textContent = "Registration Successful! Redirecting to Homepage...";

        form.reset();

        setTimeout(() => {
            window.location.href = "index.html";
        }, 2000);

    } catch (error) {
        message.style.color = "red";
        message.textContent = error.message;
    }
});
</script>

</body>
</html>
